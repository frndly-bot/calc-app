name: 'calc-app'
arch: ${GOARCH}
platform: 'linux'
version: '0.1.0'
section: 'utils'
priority: 'optional'
maintainer: 'Calc App Contributors'
description: 'A multi-mode calculator: normal, scientific, developer and finance.'
vendor: 'Calc App Contributors'
license: 'MIT'
release: '1'

contents:
  - src: './bin/calc-app'
    dst: '/usr/local/bin/calc-app'
  - src: './build/appicon.png'
    dst: '/usr/share/icons/hicolor/128x128/apps/appicon.png'
  - src: './build/linux/calc-app.desktop'
    dst: '/usr/share/applications/calc-app.desktop'

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
